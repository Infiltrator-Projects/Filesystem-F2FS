# SPDX-License-Identifier: GPL-3.0-or-later
name: F2FS Common V2 recognition qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recognition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Libraries
          ref: 225e640ebed5351b1481bfbeef1a6144ca5146e7
          path: Libraries
          persist-credentials: false
      - name: Native Common V2 hosted and import-free checks
        run: |
          test "$(git hash-object Libraries/include/infiltratr/filesystem_module_v2.h)" = 90730b68a53ecf6a6e304c789501f29c17c728c7
          make check
      - name: Independent formatter image (test oracle only)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends f2fs-tools
          truncate -s 268435456 build/foreign.img
          mkfs.f2fs -f build/foreign.img
          sha256sum build/foreign.img > build/before
          build/test_f2fs ./build/F2FS.so build/foreign.img
          build/test_f2fs ./build/freestanding/F2FS.so build/foreign.img
          sha256sum -c build/before
          mkdir -p build/tree/sub
          dd if=/dev/urandom of=build/tree/proof.bin bs=33001 count=1 status=none
          printf hello > build/tree/sub/note.txt
          sload.f2fs -f build/tree build/foreign.img
          sha256sum build/foreign.img > build/populated-before
          build/test_f2fs ./build/F2FS.so build/foreign.img build/tree/proof.bin
          build/test_f2fs ./build/freestanding/F2FS.so build/foreign.img build/tree/proof.bin
          sha256sum -c build/populated-before
      - name: Sanitizer qualification
        run: |
          make clean
          make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" check
