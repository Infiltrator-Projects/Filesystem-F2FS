# SPDX-License-Identifier: GPL-3.0-or-later
name: F2FS Common V2 recognition qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recognition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Libraries
          ref: 225e640ebed5351b1481bfbeef1a6144ca5146e7
          path: Libraries
          persist-credentials: false
      - name: Native Common V2 hosted and import-free checks
        run: |
          test "$(git hash-object Libraries/include/infiltratr/filesystem_module_v2.h)" = 90730b68a53ecf6a6e304c789501f29c17c728c7
          make check
      - name: Independent formatter image (test oracle only)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends f2fs-tools
          truncate -s 268435456 build/foreign.img
          mkfs.f2fs -f build/foreign.img
          sha256sum build/foreign.img > build/before
          build/test_f2fs ./build/F2FS.so build/foreign.img
          build/test_f2fs ./build/freestanding/F2FS.so build/foreign.img
          sha256sum -c build/before
          mkdir -p build/tree/sub
          dd if=/dev/urandom of=build/tree/proof.bin bs=33001 count=1 status=none
          printf hello > build/tree/sub/note.txt
          sload.f2fs -f build/tree build/foreign.img
          sha256sum build/foreign.img > build/populated-before
          build/test_f2fs ./build/F2FS.so build/foreign.img build/tree/proof.bin
          build/test_f2fs ./build/freestanding/F2FS.so build/foreign.img build/tree/proof.bin
          sha256sum -c build/populated-before
      - name: Sanitizer qualification
        run: |
          make clean
          make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" check

  publish:
    needs: recognition
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Libraries
          ref: 225e640ebed5351b1481bfbeef1a6144ca5146e7
          path: Libraries
          persist-credentials: false
      - name: Build, test and publish the exact native provider
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Published version is immutable; increment VERSION for another release."
            exit 0
          fi
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          sh scripts/build-release.sh portable dist
          common=$(git -C Libraries rev-parse HEAD)
          curl -fsSL --retry 3 "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$GITHUB_SHA" -o "$work/source.tar.gz"
          curl -fsSL --retry 3 "https://codeload.github.com/Infiltrator-Projects/Libraries/tar.gz/$common" -o "$work/common.tar.gz"
          source_hash=$(sha256sum "$work/source.tar.gz" | cut -d' ' -f1)
          common_hash=$(sha256sum "$work/common.tar.gz" | cut -d' ' -f1)
          run="dist/filesystem-f2fs-$version-native-installer.run"
          sed -e "s/@SOURCE@/$GITHUB_SHA/g" -e "s/@COMMON@/$common/g" -e "s/@SOURCE_HASH@/$source_hash/g" -e "s/@COMMON_HASH@/$common_hash/g" -e "s/@VERSION@/$version/g" scripts/installer.in > "$run"
          chmod +x "$run"
          "$run" --profile aggressive --system-package-mode --build-only --output "$work/native"
          deb="infiltrator-filesystem-f2fs_${version}_amd64.deb"
          pdf="System/Resources/Documentation/Filesystem-F2FS.pdf"
          so="System/Filesystems/F2FS.so"
          for package in "dist/$deb" "$work/native/$deb"; do
            test "$(dpkg-deb -f "$package" Package)" = 'infiltrator-filesystem-f2fs'
            test "$(dpkg-deb -f "$package" Version)" = "$version"
            test "$(dpkg-deb -f "$package" Architecture)" = amd64
            expected=$(printf './%s\n' "$pdf" "$so" | sort)
            actual=$(dpkg-deb --fsys-tarfile "$package" | tar -tf - | grep -v '/$' | sort)
            test "$actual" = "$expected"
            dpkg-deb -x "$package" "$work/extract"
            cmp "docs/F2FS.pdf" "$work/extract/$pdf"
            test "$(nm -D --defined-only "$work/extract/$so" | awk '{print $3}')" = infiltrator_filesystem_api_v2
          done
          test ! -e "/$pdf"
          test ! -e "/$so"
          sudo dpkg -i "$work/native/$deb"
          cmp "docs/F2FS.pdf" "/$pdf"
          cmp "$work/extract/$so" "/$so"
          sudo dpkg --purge infiltrator-filesystem-f2fs
          test ! -e "/$pdf"
          test ! -e "/$so"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          gh release create "v$version" --target "$GITHUB_SHA" --title "F2FS v$version" --notes "Bounded clean conventional single-device F2FS read-only Common V2 provider. NAT/SIT shadow and journal selection, ordinary and inline directories, file reads and live allocation accounting. Independent formatter, independently populated payload and sanitizer tests passed. Higher indirection, extra attributes, encryption/compression, recovery, mutation and physical BOOT not qualified." "dist/$deb" "$run"
